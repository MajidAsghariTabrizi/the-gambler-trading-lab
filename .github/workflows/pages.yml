name: Publish Evidence Observatory

on:
  push:
    branches: [master]
    paths:
      - 'storefront/**'
      - 'research_registry/**'
      - 'scripts/build_storefront.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check public evidence synchronization
        run: python scripts/build_storefront.py --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: storefront
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
