<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" font-family="Helvetica,Arial,sans-serif"><rect width="100%%" height="100%%" fill="#0d1b2a"/><rect x="0" y="0" width="10" height="300" fill="#2a6f97"/><text x="48" y="86" font-size="54" font-weight="bold" fill="#e7e8ea" letter-spacing="6">THE GAMBLER</text><text x="52" y="132" font-size="24" fill="#90b4ce">The Trading AI That Knows When NOT to Trade.</text><text x="52" y="170" font-size="16" fill="#5f7d95">Evidence-driven research: causal prediction, realistic execution costs, paper trading, controlled learning.</text><rect x="52" y="214" width="210" height="44" rx="8" fill="#2a6f97"/><text x="76" y="242" font-size="17" fill="#ffffff" font-weight="bold">PREDICT</text><text x="270" y="243" font-size="20" fill="#5f7d95">&#8594;</text><rect x="312" y="214" width="210" height="44" rx="8" fill="#40618c"/><text x="336" y="242" font-size="17" fill="#ffffff" font-weight="bold">PRICE THE COST</text><text x="530" y="243" font-size="20" fill="#5f7d95">&#8594;</text><rect x="572" y="214" width="210" height="44" rx="8" fill="#7a4e2d"/><text x="596" y="242" font-size="17" fill="#ffffff" font-weight="bold">RISK GATE</text><text x="790" y="243" font-size="20" fill="#5f7d95">&#8594;</text><rect x="832" y="214" width="210" height="44" rx="8" fill="#a4413c"/><text x="856" y="242" font-size="17" fill="#ffffff" font-weight="bold">NO_TRADE</text><text x="52" y="288" font-size="13" fill="#5f7d95">10,478 audited decision minutes. Zero qualifying BUYs. Every rejection justified and recorded.</text></svg>